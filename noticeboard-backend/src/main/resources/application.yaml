spring:
  application:
    name: noticeboard-backend

  datasource:
    # createDatabaseIfNotExist=true : noticeboard_db가 없으면 자동으로 만들어줌
    # DB 접속 정보는 환경변수로 주입 (DB_PASSWORD는 기본값 없음 → 반드시 설정 필요)
    url: ${DB_URL:jdbc:mysql://localhost:3306/noticeboard_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 엔티티 보고 테이블 자동 생성/수정 (개발용)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
