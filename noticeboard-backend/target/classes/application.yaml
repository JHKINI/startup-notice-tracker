spring:
  application:
    name: noticeboard-backend

  datasource:
    # createDatabaseIfNotExist=true : noticeboard_db가 없으면 자동으로 만들어줌
    url: jdbc:mysql://localhost:3306/noticeboard_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 엔티티 보고 테이블 자동 생성/수정 (개발용)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
